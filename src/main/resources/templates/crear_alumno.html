<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar alumno</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
        .contenedor { max-width: 480px; margin: 40px auto; padding: 0 16px; }
        form { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        label { display: block; margin: 12px 0 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 4px; box-sizing: border-box; }
        .acciones { margin-top: 20px; display: flex; gap: 10px; }
        button, .cancelar { padding: 9px 16px; border-radius: 6px; border: none; font-size: 14px; text-decoration: none; cursor: pointer; }
        button { background: #2e7d32; color: #fff; }
        .cancelar { background: #9e9e9e; color: #fff; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Registrar alumno</h1>
    <form th:action="@{/alumnos}" th:object="${alumno}" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" required>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" th:field="*{apellido}" required>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required>

        <div class="acciones">
            <button type="submit">Guardar</button>
            <a class="cancelar" th:href="@{/alumnos}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
